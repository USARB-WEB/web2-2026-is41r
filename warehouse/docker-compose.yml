version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-api
    ports:
      - "3000:3000"
  postgres:
    image: postgres:18
    container_name: warehouse-db
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_password
      POSTGRES_DB: warehouse_db
    ports:
      - "5432:5432"
